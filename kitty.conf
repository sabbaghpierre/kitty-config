# kitty config — port of the shared WezTerm setup (macOS + Linux, one file).
# `super` is Cmd on macOS and Super on Linux, so every binding works on both.
#
# Companion files in this directory:
#   tab-watcher.py       icons/names in tab titles + session autosave (via `watcher` below)
#   tab_bar.py           custom tab bar drawing (tab_bar_style custom)
#   freshen_sessions.py  rewrites dead claude/opencode restores in the session file
#   session-wrapper.sh   freshen + launch with the last session (recommended entry point)

#: Fonts & colors {{{
font_family Hack Nerd Font
font_size 11

# Tokyo Night (same scheme as the WezTerm config)
background #1a1b26
foreground #c0caf5
cursor #c0caf5
cursor_text_color background
selection_background #28344a
selection_foreground #c0caf5
url_color #7dcfff
show_hyperlink_targets always
hyperlink_target_position tooltip
active_border_color #7aa2f7
inactive_border_color #414868

color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
# }}}

#: Look & feel {{{
cursor_shape beam
# wezterm BlinkingBar rate; never stop blinking
cursor_blink_interval 0.8
cursor_stop_blinking_after 0
background_opacity 0.95
# blur: macOS + Wayland compositors only (no X11 blur)
background_blur 20
# dim inactive splits (wezterm inactive_pane_hsb)
inactive_text_alpha 0.8
# padding: top right bottom left (wezterm 12/12/12/8)
window_padding_width 0
# native title bar (needed to drag the window; tab bar renders below it)
hide_window_decorations no
macos_titlebar_color background
macos_option_as_alt yes
enable_audio_bell no
scrollback_lines 10000
# notify when a >5s command finishes while the window is not visible
notify_on_cmd_finish invisible 5
# ask before closing a tab/window with a running command (wezterm confirm_close_tab)
confirm_os_window_close -1
# no update pings (wezterm check_for_updates=false)
update_check_interval 0
# }}}

#: Tabs {{{
tab_bar_edge top
# flat filled tabs with small gaps, drawn by tab_bar.py
tab_bar_style custom
# breathing room around the tab bar
tab_bar_margin_height 8 6
tab_bar_margin_width 8
# '+' button after the last tab, like Warp/WezTerm
tab_bar_show_new_tab_button yes
# keep the bar visible with one tab (wezterm hide_tab_bar_if_only_one_tab=false)
tab_bar_min_tabs 1
# chip colors (tokyo night grays; blue accent swap: active_tab_background #7aa2f7, active_tab_foreground #1a1b26)
active_tab_background #3b4261
active_tab_foreground #c0caf5
active_tab_font_style bold
inactive_tab_background #24283b
inactive_tab_foreground #a9b1d6
inactive_tab_font_style normal
# tab_activity_symbol ●   # off: LSP progress (fidget) redraws nvim at ~10fps, dot was always lit
tab_title_template "{tab.program_status + ' ' if tab.program_status else ''}{title}"
# }}}

#: Sessions & watchers {{{
# Every launch restores the last session: autosaved by tab-watcher.py while
# you work (and on quit), manually with super+s. `kitty --session=none`
# starts a clean instance without restoring.
startup_session ~/.local/share/kitty/sessions/last.kitty-session
watcher tab-watcher.py
# }}}

#: Keymap (WezTerm parity) {{{
map super+t new_tab_with_cwd
map super+w close_tab
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5
map super+6 goto_tab 6
map super+7 goto_tab 7
map super+shift+[ previous_tab
map super+shift+] next_tab
map super+k clear_terminal reset active
map super+s save_as_session --save-only --use-foreground-process ~/.local/share/kitty/sessions/last.kitty-session
map super+q quit
# }}}
